spring:
  flyway:
    user: ${MYSQL_MIGRATION_USER}
    password: ${MYSQL_MIGRATION_PASSWORD}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:library_db}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  file:
    name: ${LOG_FILE:logs/library.log}
  level:
    com.library: info
    com.library.mapper: warn

library:
  legacy-baseline-version: ${LEGACY_BASELINE_VERSION:}
