name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ github.ref_name }}
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-distribution
          path: release-files
      - name: Create release without deleting existing assets or tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRARY_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$LIBRARY_TAG" >/dev/null 2>&1; then
            echo 'This release already exists; use a new version tag.' >&2
            exit 1
          fi
          gh release create "$LIBRARY_TAG" release-files/*.zip release-files/*.sha256 --verify-tag --title "$LIBRARY_TAG" --notes-file docs/releases/release-notes.md
