name: library
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-library_db}
      MYSQL_USER: library_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Set MYSQL_MIGRATION_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M", "--max-connections=40"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/10-accounts.sh:/docker-entrypoint-initdb.d/10-accounts.sh:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u library_app -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging
  backend:
    image: library-backend:${APP_VERSION:-local}
    build: { context: ./backend }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-library_db}
      MYSQL_USER: library_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_MIGRATION_USER: library_migrator
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Set MYSQL_MIGRATION_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      LEGACY_BASELINE_VERSION: ${LEGACY_BASELINE_VERSION:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18080}
      UPLOAD_DIR: /app/uploads
      LOG_FILE: /app/logs/library.log
      TRUSTED_PROXIES: ${FRONTEND_INTERNAL_IP:-172.30.88.10}
      JAVA_OPTS: "-Xms128m -Xmx384m -Djava.awt.headless=true -Duser.timezone=Asia/Shanghai"
    volumes: ["uploads:/app/uploads", "logs:/app/logs"]
    networks: [app]
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging
  frontend:
    image: library-frontend:${APP_VERSION:-local}
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      EDGE_PROXY_CIDR: ${EDGE_PROXY_CIDR:-127.0.0.1/32}
    ports: ["127.0.0.1:${FRONTEND_PORT:-18080}:80"]
    networks:
      app: { ipv4_address: "${FRONTEND_INTERNAL_IP:-172.30.88.10}" }
    depends_on: { backend: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging
volumes:
  mysql-data:
  uploads:
  logs:
networks:
  app:
    ipam:
      config: [{ subnet: "${APP_NETWORK_SUBNET:-172.30.88.0/24}" }]
